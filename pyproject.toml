[project]
name = "envr-monorepo"
version = "0.1.0"
description = "Monorepo for envr server and CLI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "cryptography>=42.0.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "tomli-w>=1.0.0",
  "platformdirs>=4.2.2",
  "pytest>=8.2.0",
]

[tool.uv.workspace]
members = ["envr_server", "envr_cli"]

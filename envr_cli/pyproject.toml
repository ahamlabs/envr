[project]
name = "envr"
version = "0.1.0"
description = "CLI for sharing signed uv.lock snapshots"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "tomli-w>=1.0.0",
  "cryptography>=42.0.0",
  "platformdirs>=4.2.2",
]

[project.scripts]
envr = "envr_cli.main:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
